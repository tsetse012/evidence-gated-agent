[project]
name = "evidence-gated-agent"
version = "0.1.0"
description = "An agent that is not allowed to say done until a second, fresh sandbox can prove it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "2026 tsetse012" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "docker: needs a working Docker daemon and the ega-sandbox:dev image",
]
filterwarnings = ["error::DeprecationWarning:ega.*"]